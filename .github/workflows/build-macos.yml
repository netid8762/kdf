name: Build macOS

# P7.2 — macOS builds (x86_64, ARM64, Universal binary).
#
# Manually dispatched until a macOS runner is provisioned. Once wired up,
# flip the `on:` block to include `push` / `pull_request` triggers and
# optionally add signing secrets (APPLE_CERTIFICATE_BASE64, APPLE_ID,
# APPLE_APP_PASSWORD, APPLE_TEAM_ID) for notarization.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
      features:
        description: "comma-separated cargo features"
        required: false
        default: ""
  workflow_call:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
        type: string
      features:
        description: "comma-separated cargo features"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: brew install protobuf

      - name: Install Rust toolchain for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build kdf (${{ matrix.target }})
        run: |
          FEATURES_FLAG=""
          if [ -n "${{ inputs.features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.features }}"
          fi
          cd mm2src
          cargo build --bin kdf --target ${{ matrix.target }} --profile ${{ inputs.profile }} $FEATURES_FLAG

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kdf-${{ matrix.target }}
          path: target/${{ matrix.target }}/${{ inputs.profile }}/kdf
